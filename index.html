<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký tư vấn</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="container hero-grid">

      <section>
        <p class="kicker">TƯ VẤN NHANH</p>

        <h1>
          Để lại thông tin,
          chúng tôi sẽ liên hệ với bạn
        </h1>

        <p class="sub">
          Điền thông tin bên cạnh để nhận tư vấn phù hợp với nhu cầu của bạn.
        </p>
      </section>

      <section class="card">
        <h2>Đăng ký tư vấn</h2>

        <form id="leadForm" novalidate>

          <label>
            Họ và tên
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Nguyễn Văn A"
            >
            <small class="error" id="nameError"></small>
          </label>

          <label>
            Số điện thoại
            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="09xxxxxxxx"
            >
            <small class="error" id="phoneError"></small>
          </label>

          <label>
            Nhu cầu
            <select id="need" name="need">
              <option value="">Chọn nhu cầu</option>
              <option>Làm website</option>
              <option>Sửa website</option>
              <option>Chatbot AI</option>
              <option>Automation</option>
            </select>

            <small class="error" id="needError"></small>
          </label>

          <button type="submit">
            Nhận tư vấn miễn phí
          </button>

          <p
            class="status"
            id="statusMessage"
            role="status"
          ></p>

        </form>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
